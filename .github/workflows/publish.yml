
name: Tech Puls Publisher

on:
  workflow_dispatch:
    inputs:
      category:
        description: News category
        required: true
        default: ai
        type: choice
        options:
          - ai
          - gadgets
          - it

  schedule:
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'

permissions:
  contents: write

concurrency:
  group: tech-puls-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_CATEGORY: ${{ inputs.category }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '0 6 * * *') CATEGORY=ai ;;
              '0 11 * * *') CATEGORY=gadgets ;;
              '0 16 * * *') CATEGORY=it ;;
              *) echo "Unknown schedule"; exit 1 ;;
            esac
          else
            CATEGORY="$MANUAL_CATEGORY"
          fi

          echo "Selected category: $CATEGORY"
          export CATEGORY
          python publish.py

      - name: Save publication history
        run: |
          if [ -f posted.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted.json

            if ! git diff --cached --quiet; then
              git commit -m "Update published news"
              git push
            fi
          fi
